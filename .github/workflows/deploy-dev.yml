name: Deploy Massage Development

on:
  push:
    branches:
      - dev

  workflow_dispatch:

concurrency:
  group: deploy-massage-development
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Deploy Massage DEV
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # =====================================================
      # INSTALL SSHPASS
      # =====================================================
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      # =====================================================
      # CONFIGURE VPS SSH HOST KEY
      # =====================================================
      - name: Configure VPS host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          ssh-keyscan \
            -p 22 \
            -H 157.66.100.68 \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      # =====================================================
      # DEPLOY
      # =====================================================
      - name: Deploy Massage DEV
        env:
          DEV_PASS: ${{ secrets.DEV_SSH_PASSWORD }}

        run: |
          sshpass -p "$DEV_PASS" ssh \
            -p 22 \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            root@157.66.100.68 \
            'bash -se' <<'EOF'

          set -Eeuo pipefail

          # =================================================
          # CONFIG
          # =================================================

          PROJECT_DIR="/root/massage-app"

          BRANCH="dev"

          COMPOSE_FILE="docker-compose.dev.yml"

          ENV_FILE=".env.dev"

          API_URL="http://127.0.0.1:7200/api/health"

          ADMIN_URL="http://127.0.0.1:7201"

          WEB_URL="http://127.0.0.1:7202"


          echo "========================================"
          echo "DEPLOY MASSAGE DEVELOPMENT"
          echo "========================================"


          # =================================================
          # CHECK PROJECT DIRECTORY
          # =================================================

          echo "==> Kiểm tra project directory"

          if [ ! -d "$PROJECT_DIR" ]; then
            echo "Không tìm thấy thư mục:"
            echo "$PROJECT_DIR"
            exit 1
          fi


          cd "$PROJECT_DIR"


          if [ ! -d ".git" ]; then
            echo "$PROJECT_DIR không phải Git repository."
            exit 1
          fi


          echo "Project directory:"
          pwd


          # =================================================
          # GET LATEST SOURCE
          # =================================================

          echo "==> Lấy source mới nhất"

          git fetch \
            --prune \
            origin \
            "$BRANCH"


          if git show-ref \
            --verify \
            --quiet \
            "refs/heads/$BRANCH"
          then

            git checkout "$BRANCH"

          else

            git checkout \
              -b "$BRANCH" \
              "origin/$BRANCH"

          fi


          git reset \
            --hard \
            "origin/$BRANCH"


          echo "Current branch:"

          git branch \
            --show-current


          echo "Current commit:"

          git log \
            -1 \
            --oneline


          # =================================================
          # CHECK REQUIRED FILES
          # =================================================

          echo "==> Kiểm tra environment và Docker files"


          test -f "$ENV_FILE" || {
            echo "Không tìm thấy:"
            echo "$PROJECT_DIR/$ENV_FILE"
            exit 1
          }


          test -f "$COMPOSE_FILE" || {
            echo "Không tìm thấy:"
            echo "$PROJECT_DIR/$COMPOSE_FILE"
            exit 1
          }


          test -f "Dockerfile.server-dev" || {
            echo "Không tìm thấy:"
            echo "$PROJECT_DIR/Dockerfile.server-dev"
            exit 1
          }


          # =================================================
          # CHECK DOCKER COMPOSE CONFIG
          # =================================================

          echo "==> Kiểm tra Docker Compose"

          docker compose \
            --env-file "$ENV_FILE" \
            -f "$COMPOSE_FILE" \
            config \
            >/dev/null


          echo "Docker Compose config hợp lệ."


          # =================================================
          # BUILD
          # =================================================

          echo "==> Build Docker images"

          docker compose \
            --env-file "$ENV_FILE" \
            -f "$COMPOSE_FILE" \
            build


          # =================================================
          # START POSTGRES + REDIS
          # =================================================

          echo "==> Khởi động PostgreSQL và Redis"

          docker compose \
            --env-file "$ENV_FILE" \
            -f "$COMPOSE_FILE" \
            up \
            -d \
            postgres \
            redis


          # =================================================
          # DATABASE MIGRATION
          # =================================================

          echo "==> Chạy database migration"

          docker compose \
            --env-file "$ENV_FILE" \
            -f "$COMPOSE_FILE" \
            run \
            --rm \
            migrate


          echo "Migration hoàn thành."


          # =================================================
          # START APPLICATIONS
          # =================================================

          echo "==> Khởi động API, Admin và Web"

          docker compose \
            --env-file "$ENV_FILE" \
            -f "$COMPOSE_FILE" \
            up \
            -d \
            --remove-orphans \
            api \
            admin \
            web


          # =================================================
          # WAIT FOR API
          # =================================================

          echo "==> Chờ API"

          API_READY=false


          for ATTEMPT in $(seq 1 30); do

            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 10 \
              "$API_URL" \
              >/dev/null
            then

              API_READY=true

              echo "API đã sẵn sàng."

              break

            fi


            echo "Đang chờ API... ${ATTEMPT}/30"

            sleep 2

          done


          if [ "$API_READY" != "true" ]; then

            echo "API không sẵn sàng sau thời gian chờ."


            docker logs \
              --tail=200 \
              massage-api-dev \
              || true


            exit 1

          fi


          # =================================================
          # WAIT FOR ADMIN
          # =================================================

          echo "==> Chờ Admin"

          ADMIN_READY=false


          for ATTEMPT in $(seq 1 30); do

            if curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --max-time 10 \
              "$ADMIN_URL" \
              >/dev/null
            then

              ADMIN_READY=true

              echo "Admin đã sẵn sàng."

              break

            fi


            echo "Đang chờ Admin... ${ATTEMPT}/30"

            sleep 2

          done


          if [ "$ADMIN_READY" != "true" ]; then

            echo "Admin không sẵn sàng sau thời gian chờ."


            docker logs \
              --tail=200 \
              massage-admin-dev \
              || true


            exit 1

          fi


          # =================================================
          # WAIT FOR WEB
          # =================================================

          echo "==> Chờ Web"

          WEB_READY=false


          for ATTEMPT in $(seq 1 30); do

            if curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --max-time 10 \
              "$WEB_URL" \
              >/dev/null
            then

              WEB_READY=true

              echo "Web đã sẵn sàng."

              break

            fi


            echo "Đang chờ Web... ${ATTEMPT}/30"

            sleep 2

          done


          if [ "$WEB_READY" != "true" ]; then

            echo "Web không sẵn sàng sau thời gian chờ."


            docker logs \
              --tail=200 \
              massage-web-dev \
              || true


            exit 1

          fi


          # =================================================
          # API HEALTH CHECK
          # =================================================

          echo "==> Kiểm tra API health"

          API_HEALTH="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --max-time 10 \
              "$API_URL"
          )"


          echo "$API_HEALTH"


          # =================================================
          # DOCKER STATUS
          # =================================================

          echo "==> Trạng thái Docker containers"

          docker compose \
            --env-file "$ENV_FILE" \
            -f "$COMPOSE_FILE" \
            ps \
            -a


          # =================================================
          # CLEANUP
          # =================================================

          echo "==> Xóa dangling Docker images"

          docker image prune \
            -f


          echo "========================================"
          echo "DEPLOY MASSAGE DEV THÀNH CÔNG"
          echo "========================================"

          EOF
