services:
  # =========================================================
  # POSTGRESQL
  # =========================================================
  postgres:
    image: postgres:16-alpine
    container_name: massage-postgres-dev
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}

    ports:
      - "127.0.0.1:${DB_PUBLIC_PORT:-7432}:5432"

    volumes:
      - massage-postgres-dev-data:/var/lib/postgresql/data

    networks:
      - massage-dev-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 20


  # =========================================================
  # REDIS
  # =========================================================
  redis:
    image: redis:7-alpine
    container_name: massage-redis-dev
    restart: unless-stopped

    ports:
      - "127.0.0.1:${REDIS_PUBLIC_PORT:-7379}:6379"

    volumes:
      - massage-redis-dev-data:/data

    networks:
      - massage-dev-network

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 20


  # =========================================================
  # DATABASE MIGRATION
  # =========================================================
  migrate:
    container_name: massage-migrate-dev
    restart: "no"

    build:
      context: .
      dockerfile: Dockerfile.server-dev
      args:
        APP_FILTER: "@massage/api"

    env_file:
      - .env.dev

    environment:
      NODE_ENV: development

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      DB_NAME: ${DB_NAME}
      DB_DATABASE: ${DB_DATABASE}

      SUPER_ADMIN_FULL_NAME: ${SUPER_ADMIN_FULL_NAME}
      SUPER_ADMIN_PHONE: ${SUPER_ADMIN_PHONE}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}

    command:
      [
        "pnpm",
        "run",
        "db:migration:run"
      ]

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - massage-dev-network


  # =========================================================
  # API
  # =========================================================
  api:
    container_name: massage-api-dev
    restart: unless-stopped

    build:
      context: .
      dockerfile: Dockerfile.server-dev
      args:
        APP_FILTER: "@massage/api"

    env_file:
      - .env.dev

    environment:
      NODE_ENV: development
      PORT: 7200

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      DB_NAME: ${DB_NAME}
      DB_DATABASE: ${DB_DATABASE}

      DB_SYNC: ${DB_SYNC:-false}
      DB_SSL: ${DB_SSL:-false}

      REDIS_HOST: redis
      REDIS_PORT: 6379

    ports:
      - "7200:7200"

    command:
      [
        "pnpm",
        "--filter",
        "@massage/api",
        "start:prod"
      ]

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - massage-dev-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:7200/api/health >/dev/null || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s


  # =========================================================
  # ADMIN
  # =========================================================
  admin:
    container_name: massage-admin-dev
    restart: unless-stopped

    build:
      context: .
      dockerfile: Dockerfile.server-dev
      args:
        APP_FILTER: "@massage/admin"
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

    env_file:
      - .env.dev

    environment:
      NODE_ENV: production
      PORT: 7201
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

    ports:
      - "7201:7201"

    command:
      [
        "pnpm",
        "--filter",
        "@massage/admin",
        "start"
      ]

    depends_on:
      - api

    networks:
      - massage-dev-network


  # =========================================================
  # CLIENT / THERAPIST WEB
  # =========================================================
  web:
    container_name: massage-web-dev
    restart: unless-stopped

    build:
      context: .
      dockerfile: Dockerfile.server-dev
      args:
        APP_FILTER: "@massage/web"
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

    env_file:
      - .env.dev

    environment:
      NODE_ENV: production
      PORT: 7202
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

    ports:
      - "7202:7202"

    command:
      [
        "pnpm",
        "--filter",
        "@massage/web",
        "start"
      ]

    depends_on:
      - api

    networks:
      - massage-dev-network


# =========================================================
# VOLUMES
# =========================================================
volumes:
  massage-postgres-dev-data:
  massage-redis-dev-data:


# =========================================================
# NETWORKS
# =========================================================
networks:
  massage-dev-network:
    driver: bridge